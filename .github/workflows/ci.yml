name: 免费发布门禁

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: community-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试、许可与密钥检查
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 读取仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 准备 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: 运行免费发布门禁
        run: npm run verify:public
